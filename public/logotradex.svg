<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0B0E14" />
    </radialGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Electric Violet Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#E100FF" />
    </linearGradient>

    <!-- Glowing Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Container -->
  <rect width="500" height="500" rx="32" fill="url(#bgGrad)" />

  <!-- Logo Mark Group -->
  <g transform="translate(100, 100)">
    <!-- Outer Hexagon Ring -->
    <polygon points="150,15 265,80 265,220 150,285 35,220 35,80" 
             fill="none" 
             stroke="url(#cyanGrad)" 
             stroke-width="8" 
             stroke-linejoin="round"
             filter="url(#glow)" />

    <!-- Candlestick / Upward Trend Bar 1 -->
    <rect x="90" y="140" width="18" height="60" rx="4" fill="url(#violetGrad)" />
    <line x1="99" y1="120" x2="99" y2="215" stroke="#E100FF" stroke-width="4" stroke-linecap="round" />

    <!-- Candlestick / Upward Trend Bar 2 -->
    <rect x="141" y="90" width="18" height="100" rx="4" fill="url(#cyanGrad)" />
    <line x1="150" y1="70" x2="150" y2="205" stroke="#00F2FE" stroke-width="4" stroke-linecap="round" />

    <!-- Dynamic "X" / Crypto Growth Arrow -->
    <path d="M 85 195 L 185 95 L 215 125" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />
    <polyline points="185,95 215,95 215,125" fill="none" stroke="#00F2FE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="250" y="420" 
        font-family="'Inter', system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="38" 
        letter-spacing="6" 
        text-anchor="middle" 
        fill="#FFFFFF">
    TRADE<tspan fill="#00F2FE">X</tspan>
  </text>
</svg>
